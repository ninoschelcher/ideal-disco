title: Oradoro
description: >-
  Als doula sta ik naast jou en je partner: rustig, betrokken en zonder oordeel.
  Zodat je je bevalling met vertrouwen tegemoet gaat.
sections:
  - discriminant: hero
    value:
      title: Warm gedragen, van zwangerschap tot kraamtijd.
      highlight: kraamtijd
      intro: >-
        Als doula sta ik naast jou en je partner: rustig, betrokken en zonder
        oordeel. Zodat je je bevalling met vertrouwen tegemoet gaat en je je
        gezien voelt, wat er ook gebeurt.
      primary:
        label: Plan een gratis kennismaking
        href: "#contact"
      secondary:
        label: Wat doet een doula?
        href: "#features"
  - discriminant: features
    value:
      eyebrow: Wat is een doula
      title: Een vertrouwd gezicht naast je, van begin tot eind
      intro: >-
        Een doula biedt emotionele en praktische steun rond de geboorte. Ik ben
        geen medische zorgverlener: ik werk naast je verloskundige of
        gynaecoloog en je kraamverzorgende, en help je je eigen weg te vinden in
        alle keuzes.
      items:
        - icon: heart
          title: Emotionele steun
          text: >-
            Ruimte voor je wensen, twijfels en eerdere ervaringen. Ik luister,
            stel gerust en help je je stem te gebruiken.
        - icon: book
          title: Informatie & voorbereiding
          text: >-
            Samen maken we je geboorteplan, oefenen we ademhaling en houdingen
            en bespreken we wat je kunt verwachten.
        - icon: sun
          title: Continue aanwezigheid
          text: >-
            Tijdens de bevalling blijf ik bij je, thuis of in het ziekenhuis,
            ook als diensten wisselen. Ook je partner krijgt houvast.
  - discriminant: steps
    value:
      eyebrow: Begeleiding
      title: Zo loop ik met je mee
      intro: ""
      items:
        - title: Zwangerschap
          points:
            - Gratis kennismakingsgesprek
            - "[AANTAL] voorbereidende gesprekken bij jou thuis"
            - Geboortewensen en geboorteplan
            - Ademhaling, ontspanning en houdingen
        - title: Bevalling
          points:
            - Dag en nacht oproepbaar van 37 tot 42 weken
            - Aanwezig vanaf het moment dat jij me nodig hebt
            - Thuis, in een geboortecentrum of het ziekenhuis
            - Comfortmaatregelen, rust en ondersteuning voor je partner
        - title: Kraamtijd
          points:
            - Kraambezoek in de eerste week
            - Nagesprek over jullie geboorteverhaal
            - Hulp bij de eerste dagen thuis
            - Doorverwijzing waar dat nodig is
  - discriminant: pricing
    value:
      eyebrow: Tarieven
      title: Kies wat bij jullie past
      intro: >-
        Doulazorg valt niet onder de basisverzekering. Sommige aanvullende
        verzekeringen vergoeden een deel; check je polis of vraag het mij, ik
        denk graag mee.
      plans:
        - name: Voorbereiding
          price: "[PRIJS]"
          points:
            - Kennismaking
            - "[AANTAL] gesprekken tijdens de zwangerschap"
            - Geboorteplan op maat
          featured: false
          badge: ""
          button:
            label: Meer weten
            href: "#contact"
        - name: Volledige begeleiding
          price: "[PRIJS]"
          points:
            - Alles uit Voorbereiding
            - Oproepbaar van 37 tot 42 weken
            - Aanwezig bij de bevalling
            - Kraambezoek en nagesprek
          featured: true
          badge: Meest gekozen
          button:
            label: Plan een kennismaking
            href: "#contact"
        - name: Kraamtijd
          price: "[PRIJS]"
          points:
            - "[AANTAL] bezoeken na de geboorte"
            - Verwerken van je geboorteverhaal
            - Steun in de eerste weken thuis
          featured: false
          badge: ""
          button:
            label: Meer weten
            href: "#contact"
  - discriminant: about
    value:
      eyebrow: Over mij
      title: Hoi, ik ben [NAAM]
      image: null
      imageAlt: ""
      body: >-
        [Een paar zinnen over jou: waarom je doula bent geworden, je achtergrond
        en opleiding, en wat je belangrijk vindt in de begeleiding.]


        De naam Oradoro staat voor [BETEKENIS]. Zoals de zon en de golven in mijn
        logo: warmte die blijft, en beweging die je draagt.
      quote: Jij bevalt. Ik zorg dat je dat niet alleen hoeft te doen.
  - discriminant: faq
    value:
      eyebrow: Veelgestelde vragen
      title: Goed om te weten
      items:
        - question: Wordt een doula vergoed?
          answer: >-
            Een doula valt niet onder de basisverzekering. Sommige aanvullende
            verzekeringen vergoeden (een deel van) de kosten. Kijk in je polis of
            neem contact op met je verzekeraar.
        - question: Vervangt een doula mijn verloskundige?
          answer: >-
            Nee. Een doula geeft geen medische zorg. Ik werk naast je
            verloskundige of gynaecoloog en je kraamverzorgende, en richt me op
            jouw rust, comfort en vertrouwen.
        - question: Wat heeft mijn partner aan een doula?
          answer: >-
            Veel. Je partner kan er helemaal voor jou zijn, terwijl ik tips geef,
            even aflos en zorg dat jullie allebei goed geïnformeerd zijn.
        - question: Wanneer neem ik het beste contact op?
          answer: >-
            Het liefst rond de 20 weken, zodat we rustig kunnen voorbereiden.
            Later in de zwangerschap kan ook: neem gerust contact op.
        - question: Ga je ook mee naar het ziekenhuis?
          answer: >-
            Ja. Ik begeleid je waar je ook bevalt: thuis, in een geboortecentrum
            of in het ziekenhuis.
  - discriminant: contact
    value:
      eyebrow: Contact
      title: Zullen we kennismaken?
      intro: >-
        Een kennismaking is vrijblijvend en kosteloos. Neem gerust vroeg in je
        zwangerschap contact op; later kan ook, ik kijk graag wat er nog
        mogelijk is.
      email: "[E-MAIL]"
      phone: "[TELEFOON]"
      region: "[REGIO]"
